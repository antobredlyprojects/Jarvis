<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' ws://localhost:8765 http://localhost:3000;">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%;height:100%;overflow:hidden;background:#050505;color:#e5e2e1;font-family:'Geist Mono','JetBrains Mono',monospace;user-select:none; }

/* Shader bg */
#shader-canvas { position:fixed;inset:0;width:100vw;height:100vh;z-index:-3;pointer-events:none; }

/* Overlays */
.scanlines {
  position:fixed;inset:0;
  background:linear-gradient(to bottom,rgba(18,16,16,0) 50%,rgba(0,0,0,0.18) 50%);
  background-size:100% 4px;z-index:100;pointer-events:none;opacity:0.22;
}
.grid {
  position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,219,233,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,219,233,0.035) 1px,transparent 1px);
  background-size:40px 40px;z-index:-2;pointer-events:none;
}

/* Drag + win controls */
.drag { position:fixed;top:0;left:0;right:0;height:36px;-webkit-app-region:drag;z-index:500; }
.win-ctrl { position:fixed;top:12px;right:16px;display:flex;gap:10px;z-index:600;-webkit-app-region:no-drag; }
.wbtn { background:none;border:none;color:rgba(0,219,233,0.35);font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;width:24px;height:16px;transition:color 0.15s; }
.wbtn:hover { color:#00dbe9; }
.wbtn.cls:hover { color:#ff5566; }

/* Glitch entrance */
.ge { animation:glitch 0.8s cubic-bezier(.25,.46,.45,.94) both; }
@keyframes glitch {
  0%{opacity:0;transform:translate(4px,0)} 20%{opacity:0.5;transform:translate(-4px,0)}
  40%{opacity:0.2;transform:translate(2px,0)} 60%{opacity:0.8;transform:translate(-2px,0)}
  80%{opacity:0.4;transform:translate(1px,0)} 100%{opacity:1;transform:translate(0,0)}
}

/* Brand */
.brand { position:fixed;top:16px;left:24px;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:#00dbe9;z-index:60;-webkit-app-region:no-drag; }

/* Ambient glow */
.glow { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;background:rgba(0,219,233,0.07);border-radius:50%;filter:blur(160px);z-index:-1;pointer-events:none; }

/* Sphere */
#sphere-container { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;z-index:10;pointer-events:none; }

/* Corner data */
.cd { position:fixed;font-size:9px;letter-spacing:0.12em;color:rgba(185,202,203,0.45);z-index:55;line-height:2; }
.cd-tl { top:56px;left:24px; }
.cd-tr { top:56px;right:24px;text-align:right; }
.cd-bl { bottom:160px;left:24px; }
.cd-br { bottom:160px;right:24px;text-align:right; }
.cd-lbl { font-size:7px;letter-spacing:0.2em;color:rgba(185,202,203,0.28);text-transform:uppercase;margin-bottom:3px; }
.cd-val { font-size:15px;color:#00dbe9;font-weight:600;letter-spacing:0.05em; }
.cd-val.g { color:#5dffb0; }
.cd-val.a { color:#ffcc44; }

/* Status ring around sphere */
.status-label {
  position:absolute;bottom:172px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;z-index:60;
}
.sdot { width:6px;height:6px;border-radius:50%;background:#00dbe9;position:relative;flex-shrink:0; }
.sdot::after { content:'';position:absolute;inset:0;border-radius:50%;background:#00dbe9;animation:ping 1.5s ease-out infinite; }
@keyframes ping { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.5);opacity:0} }
.sdot.thinking { background:#ffcc44; }
.sdot.thinking::after { background:#ffcc44; }
.sdot.speaking { background:#a78bfa; }
.sdot.speaking::after { background:#a78bfa; }
.sdot.offline { background:#ff5566; }
.sdot.offline::after { display:none; }
.stext { font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:#00dbe9;animation:sp 2s ease-in-out infinite; }
.stext.thinking { color:#ffcc44; }
.stext.speaking { color:#a78bfa; }
.stext.offline  { color:#ff5566;animation:none; }
@keyframes sp { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* Chat panel */
.chat-panel {
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:24px;
}

.chat-divider {
  width:600px;max-width:82vw;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,219,233,0.2),transparent);
  margin-bottom:12px;position:relative;
}
.chat-divider::before {
  content:'NEURAL INTERFACE';position:absolute;top:-5px;left:0;
  font-size:7px;letter-spacing:0.4em;color:rgba(0,219,233,0.2);
}

.chat-msgs {
  width:600px;max-width:82vw;max-height:130px;
  overflow-y:auto;scrollbar-width:none;
  display:flex;flex-direction:column;gap:5px;
  margin-bottom:12px;scroll-behavior:smooth;
}
.chat-msgs::-webkit-scrollbar { display:none; }

.msg { font-size:10px;line-height:1.6; }
.msg.jarvis { color:rgba(0,219,233,0.9); }
.msg.user   { color:rgba(185,202,203,0.6); }
.msg.system { color:rgba(255,204,68,0.7);font-style:italic; }
.msg-who { font-size:7px;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:1px; }
.msg.jarvis .msg-who { color:rgba(0,219,233,0.4); }
.msg.user   .msg-who { color:rgba(185,202,203,0.25); }
.msg.system .msg-who { color:rgba(255,204,68,0.3); }

/* Typing indicator */
.typing { display:none;gap:5px;align-items:center;margin-bottom:8px; }
.typing.show { display:flex; }
.tdot { width:3px;height:3px;border-radius:50%;background:#00dbe9;animation:td 1s ease-in-out infinite; }
.tdot:nth-child(2){animation-delay:0.15s}.tdot:nth-child(3){animation-delay:0.3s}
@keyframes td { 0%,100%{opacity:0.1;transform:scale(0.7)} 50%{opacity:1;transform:scale(1)} }

/* Input row (text fallback, always shown) */
.input-row { display:flex;gap:8px;align-items:center;width:600px;max-width:82vw; }
.hud-input {
  flex:1;background:rgba(20,20,20,0.6);
  border:none;border-bottom:1px solid rgba(0,219,233,0.2);
  color:#e5e2e1;font-family:'Geist Mono',monospace;
  font-size:11px;padding:8px 0;outline:none;letter-spacing:0.02em;
  transition:border-color 0.2s;
}
.hud-input::placeholder { color:rgba(185,202,203,0.2); }
.hud-input:focus { border-bottom-color:rgba(0,219,233,0.5); }
.send-btn {
  background:none;border:1px solid rgba(0,219,233,0.2);
  color:rgba(0,219,233,0.5);font-family:'Geist Mono',monospace;
  font-size:9px;letter-spacing:0.15em;padding:8px 14px;
  cursor:pointer;text-transform:uppercase;transition:all 0.15s;border-radius:2px;
}
.send-btn:hover { border-color:#00dbe9;color:#00dbe9; }

/* WS connection badge */
.ws-badge {
  position:fixed;top:16px;right:80px;font-size:7px;letter-spacing:0.2em;
  text-transform:uppercase;color:rgba(185,202,203,0.3);z-index:60;
  display:flex;align-items:center;gap:5px;
}
.ws-dot { width:4px;height:4px;border-radius:50%;background:#ff5566; }
.ws-dot.connected { background:#5dffb0; }
</style>
</head>
<body>

<canvas id="shader-canvas"></canvas>
<div class="scanlines"></div>
<div class="grid"></div>
<div class="drag"></div>

<div class="win-ctrl">
  <button class="wbtn" onclick="window.jarvisAPI&&window.jarvisAPI.minimize()">—</button>
  <button class="wbtn cls" onclick="window.jarvisAPI&&window.jarvisAPI.close()">✕</button>
</div>

<div class="brand ge" style="animation-delay:0.1s">J.A.R.V.I.S.</div>

<div class="ws-badge ge" style="animation-delay:0.2s">
  <div class="ws-dot" id="ws-dot"></div>
  <span id="ws-label">OFFLINE</span>
</div>

<div style="position:relative;width:100%;height:100vh;overflow:hidden">
  <div class="glow"></div>
  <div id="sphere-container"></div>

  <!-- Corner telemetry -->
  <div class="cd cd-tl ge" style="animation-delay:0.3s">
    <div class="cd-lbl">System Load</div>
    <div class="cd-val" id="cpu-val">—</div>
  </div>
  <div class="cd cd-tr ge" style="animation-delay:0.3s">
    <div class="cd-lbl">Queries</div>
    <div class="cd-val g" id="query-count">0</div>
  </div>
  <div class="cd cd-bl ge" style="animation-delay:0.4s">
    <div class="cd-lbl">Memory Bank</div>
    <div class="cd-val g" id="mem-facts">—</div>
  </div>
  <div class="cd cd-br ge" style="animation-delay:0.4s">
    <div class="cd-lbl">Latency</div>
    <div class="cd-val a" id="resp-time">—</div>
  </div>
</div>

<!-- Status indicator -->
<div class="status-label ge" style="animation-delay:0.5s">
  <div class="sdot offline" id="sdot"></div>
  <span class="stext offline" id="stext">Waiting for Python...</span>
</div>

<!-- Chat panel -->
<div class="chat-panel ge" style="animation-delay:0.6s">
  <div class="chat-divider"></div>
  <div class="chat-msgs" id="chat-msgs"></div>
  <div class="typing" id="typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>
  <div class="input-row">
    <input class="hud-input" id="chat-input" placeholder="type a directive (or use your voice)..." autocomplete="off"/>
    <button class="send-btn" onclick="sendTyped()">Send</button>
  </div>
</div>

<!-- ═══ Three.js Holographic Sphere ═══ -->
<script>
(function(){
  const container = document.getElementById('sphere-container');
  const W = container.clientWidth||520, H = container.clientHeight||520;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, W/H, 0.1, 1000);
  camera.position.z = 4;
  const renderer = new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setSize(W,H); renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  const layerCount=8, baseRadius=1.2;
  const colors=[0x00f0ff,0x9d00ff,0x0099ff];
  for(let i=0;i<layerCount;i++){
    const geo=new THREE.SphereGeometry(baseRadius+i*0.025,32,32);
    const mat=new THREE.MeshPhongMaterial({
      color:colors[i%colors.length],transparent:true,
      opacity:0.2*(1-i/layerCount),wireframe:i%2===0,
      blending:THREE.AdditiveBlending,side:THREE.DoubleSide,shininess:50
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.rotation.x=Math.random()*Math.PI;
    mesh.rotation.y=Math.random()*Math.PI;
    mesh.userData.rs={x:(Math.random()-0.5)*0.008,y:(Math.random()-0.5)*0.008};
    group.add(mesh);
  }
  const nGeo=new THREE.SphereGeometry(0.015,8,8);
  for(let i=0;i<50;i++){
    const nMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5});
    const node=new THREE.Mesh(nGeo,nMat);
    const phi=Math.acos(-1+(2*i)/50);
    const theta=Math.sqrt(50*Math.PI)*phi;
    node.position.setFromSphericalCoords(baseRadius+0.05,phi,theta);
    group.add(node);
  }
  scene.add(new THREE.AmbientLight(0xffffff,0.4));
  const pl=new THREE.PointLight(0x00f0ff,0.8,10);
  pl.position.set(2,2,2); scene.add(pl);

  let mx=0,my=0;
  window.addEventListener('mousemove',(e)=>{mx=(e.clientX/window.innerWidth)*2-1;my=-(e.clientY/window.innerHeight)*2+1;});

  // Expose scale target so events can pulse the sphere
  window.__sphereScale = 1.0;
  window.__sphereTarget = 1.0;

  function animate(){
    requestAnimationFrame(animate);
    group.children.forEach(c=>{if(c.userData.rs){c.rotation.x+=c.userData.rs.x;c.rotation.y+=c.userData.rs.y;}});
    group.rotation.y+=0.001;
    group.rotation.x+=(my*0.1-group.rotation.x)*0.05;
    group.rotation.y+=(mx*0.1-group.rotation.y)*0.05;
    window.__sphereScale+=(window.__sphereTarget-window.__sphereScale)*0.07;
    group.scale.setScalar(window.__sphereScale);
    renderer.render(scene,camera);
  }
  window.addEventListener('resize',()=>{
    const w=container.clientWidth||520,h=container.clientHeight||520;
    renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  });
  animate();
})();
</script>

<!-- ═══ WebGL Shader Background ═══ -->
<script>
(function(){
  const canvas=document.getElementById('shader-canvas');
  const gl=canvas.getContext('webgl');
  if(!gl)return;
  const vs=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`;
  const fs=`precision highp float;varying vec2 v;uniform float t;
    void main(){
      vec2 uv=v;float d=length(uv-vec2(.5));
      vec3 c1=vec3(0.,.94,1.),c2=vec3(.6,0.,1.);
      float ring=sin(d*15.-t*1.5)*.5+.5;ring*=exp(-d*3.);
      vec3 col=mix(c1,c2,uv.y+sin(t*.2));col*=(ring*.25+.05);
      col*=smoothstep(1.2,.4,d);gl_FragColor=vec4(col*.4,1.);
    }`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);
  gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
  const tl=gl.getUniformLocation(prog,'t');
  function render(ts){gl.uniform1f(tl,ts*.001);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render);}
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
  window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
})();
</script>

<!-- ═══ App Logic ═══ -->
<script>
const SERVER   = 'http://localhost:3000';
const WS_URL   = 'ws://localhost:8765';

let queryCount = 0;
let ws         = null;
let wsConnected = false;
let wsReconnectDelay = 1000;
const WS_MAX_DELAY = 30000;

// ── Sphere state helpers ──────────────────────────────────────────────────────
function sphereSet(state) {
  // listening: normal | thinking: big pulse | speaking: gentle glow | idle: small
  if      (state === 'thinking') window.__sphereTarget = 1.25;
  else if (state === 'speaking') window.__sphereTarget = 1.12;
  else if (state === 'listening') window.__sphereTarget = 1.0;
  else                           window.__sphereTarget = 0.95;
}

// ── Status dot ───────────────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot  = document.getElementById('sdot');
  const stxt = document.getElementById('stext');
  dot.className  = 'sdot ' + state;
  stxt.className = 'stext ' + state;
  stxt.textContent = text;
  sphereSet(state);
}

// ── Chat messages ─────────────────────────────────────────────────────────────
const msgsEl   = document.getElementById('chat-msgs');
const typingEl = document.getElementById('typing');

function addMsg(text, who) {
  const d   = document.createElement('div');
  d.className = 'msg ' + who;
  const tag = document.createElement('div');
  tag.className = 'msg-who';
  const labels = { jarvis:'JARVIS', user:'YOU', system:'SYSTEM' };
  tag.textContent = labels[who] || who.toUpperCase();
  d.appendChild(tag);
  d.appendChild(document.createTextNode(text));
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── WebSocket connection to server bridge ─────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsConnected = true;
    wsReconnectDelay = 1000; // reset on successful connect
    document.getElementById('ws-dot').className  = 'ws-dot connected';
    document.getElementById('ws-label').textContent = 'LIVE';
    setStatus('listening', 'Listening...');
  };

  ws.onmessage = (evt) => {
    let event;
    try { event = JSON.parse(evt.data); } catch(e) { return; }

    const { type, text } = event;

    switch (type) {
      case 'listening':
        setStatus('listening', 'Listening...');
        typingEl.classList.remove('show');
        break;

      case 'user':
        if (text) {
          addMsg(text, 'user');
          setStatus('thinking', 'Processing...');
          typingEl.classList.add('show');
        }
        break;

      case 'thinking':
        setStatus('thinking', 'Thinking...');
        typingEl.classList.add('show');
        break;

      case 'jarvis':
        typingEl.classList.remove('show');
        if (text) addMsg(text, 'jarvis');
        setStatus('speaking', 'Speaking...');
        queryCount++;
        document.getElementById('query-count').textContent = queryCount;
        break;

      case 'status':
        if (text.toLowerCase().includes('listen')) {
          setStatus('listening', text);
          typingEl.classList.remove('show');
        } else if (text.toLowerCase().includes('think') || text.toLowerCase().includes('process')) {
          setStatus('thinking', text);
        } else if (text.toLowerCase().includes('speak')) {
          setStatus('speaking', text);
        } else {
          setStatus('listening', text);
        }
        break;

      case 'system_cmd':
        if (text) addMsg(text, 'system');
        break;
    }

    throttledFetchMemCount();
  };

  ws.onclose = () => {
    wsConnected = false;
    document.getElementById('ws-dot').className  = 'ws-dot';
    document.getElementById('ws-label').textContent = 'OFFLINE';
    setStatus('offline', 'Waiting for Python...');
    // Exponential backoff reconnect
    setTimeout(() => {
      wsReconnectDelay = Math.min(wsReconnectDelay * 1.5, WS_MAX_DELAY);
      connectWS();
    }, wsReconnectDelay);
  };

  ws.onerror = () => ws.close();
}

// ── Typed input fallback (sends directly to server) ──────────────────────────
const inputEl = document.getElementById('chat-input');

async function sendTyped() {
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = '';
  addMsg(q, 'user');
  setStatus('thinking', 'Thinking...');
  typingEl.classList.add('show');

  const now = new Date();
  const t0  = Date.now();
  try {
    const res = await fetch(SERVER + '/api/jarvis/voice-query', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        prompt: q,
        currentTime: now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true}),
        currentDate: now.toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'})
      })
    });
    const data = await res.json();
    const ms = Date.now() - t0;
    document.getElementById('resp-time').textContent = ms + 'ms';
    typingEl.classList.remove('show');
    const resp = data.response || 'No response.';
    // Parse system commands (single or multi-step array)
    let handled = false;
    // Try array first: [{"action":"SYSTEM_COMMAND",...}, ...]
    const arrMatch = resp.match(/\[\s*\{\s*\"action\":\s*\"SYSTEM_COMMAND\"[\s\S]*?\]\s*\]/);
    if (arrMatch) {
      try {
        const cmds = JSON.parse(arrMatch[0]);
        const prefix = resp.slice(0, resp.indexOf(arrMatch[0])).trim();
        if (prefix) addMsg(prefix, 'jarvis');
        if (Array.isArray(cmds) && cmds.length > 0) {
          addMsg('Executing ' + cmds.length + ' steps: ' + cmds.map(c => c.command).join(', ') + '...', 'system');
          handled = true;
        }
      } catch(e) {}
    }
    // Try single command
    if (!handled) {
      const cmdMatch = resp.match(/\{"action":"SYSTEM_COMMAND"[\s\S]*?\}/);
      if (cmdMatch) {
        try {
          const cmd = JSON.parse(cmdMatch[0]);
          const prefix = resp.slice(0, resp.indexOf(cmdMatch[0])).trim();
          if (prefix) addMsg(prefix, 'jarvis');
          addMsg('Executing: ' + (cmd.command || 'command') + '...', 'system');
          handled = true;
        } catch(e) {}
      }
    }
    if (!handled) {
      addMsg(resp, 'jarvis');
    }
    setStatus('speaking', 'Speaking...');
    setTimeout(() => setStatus('listening', 'Listening...'), 2000);
    throttledFetchMemCount();
  } catch(e) {
    typingEl.classList.remove('show');
    addMsg('Cannot reach server at ' + SERVER, 'system');
    setStatus('offline', 'Connection Error');
  }
}

inputEl.addEventListener('keydown', e => { if(e.key==='Enter') sendTyped(); });

// ── Fake CPU vitals ───────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('cpu-val').textContent = (15+Math.floor(Math.random()*35)) + '%';
}, 3000);

// ── Memory count (throttled) ──────────────────────────────────────────
let lastMemFetch = 0;
async function fetchMemCount() {
  try {
    const r = await fetch(SERVER + '/api/jarvis/memory');
    const d = await r.json();
    document.getElementById('mem-facts').textContent = d.facts ? d.facts.length : 0;
  } catch(e) {}
}
function throttledFetchMemCount() {
  const now = Date.now();
  if (now - lastMemFetch > 10000) {
    lastMemFetch = now;
    fetchMemCount();
  }
}
fetchMemCount();

// ── Kick off WS connection ────────────────────────────────────────────────────
connectWS();
</script>
</body>
</html>
